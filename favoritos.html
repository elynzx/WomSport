<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
  <!-- CSS -->

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/paginas/inicio.css" />
  <link rel="stylesheet" href="css/componentes/product.css" />
  <link rel="stylesheet" href="css/componentes/header.css" />
  <link rel="stylesheet" href="css/componentes/footer.css" />
  <link rel="stylesheet" href="css/paginas/favoritos.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <title>WomSport</title>
</head>

<body>
  <header>
    <center>
      <p class="delivery">¡Envío gratuito en pedidos superiores a S/200!</p>
    </center>
    <div class="header_content">
      <nav class="header_nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="tienda.html">Tienda</a></li>
          <li><a href="ofertas.html">Ofertas</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

      <div class="header_logo">
        <a href="index.html"><img src="img/logo.png" alt="Logo de WomSport" /></a>
      </div>

      <div class="header_right">
        <div class="search_bar">

          <input type="text" id="search-input" placeholder="Buscar" />
          <span id="search-btn"> <i class="fa-solid fa-magnifying-glass"></i> </span>
        </div>
        <div class="header_icons">
          <a href="favoritos.html" class="icon_nav">
            <i class="fa-regular fa-heart"></i>
          </a>
          <a href="carrito.html" class="icon_nav">
            <i class="fas fa-shopping-cart"></i>
          </a>
          <a href="sesion.html" class="icon_nav">
            <i class="fa-regular fa-user"></i>
          </a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div id="header_fav">
      <div><span id="cant_fav"></span></div>
      <div>
        <p>EDITAR</p>
      </div>
    </div>

    <div x-data="menuHandler()" class="relative">
      <template x-for="product in products" :key="product.id">
        <div class="section_fav">
          <div class="product_fav">
            <img :src="product.image" alt="" />
            <div class="info_fav">
              <div class="top_fav">
                <h1 x-text="product.name"></h1>
                <button @click="openMenu(product.id, product.categoria, $event)" class="more_fav"><i
                    class="fas fa-edit"></i></button>
              </div>
              <div class="resume_fav">
                <p class="product-meta">
                  <strong style="padding-right: 2rem" x-text="'S/ ' + product.price"></strong>
                  <span x-text="product.sold + ' vendidos | '"></span>
                  <img style="height: 15px; width: 15px" src="img/estrellas/star.svg" alt="" />
                  <span x-text="product.rating"></span>
                </p>
                <p>Envío gratis a partir de S/ 200.00</p>
                <button class="add_fav">Agregar al Carro</button>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- Menu -->
      <div x-show="open" x-transition x-ref="menu" @click.outside="open = false" class="menu"
        :style="{ top: `${menuY}px`, left: `${menuX}px` }">
        <button @click="moveTo(currentCategoria); open = false">
          Artículos similares
        </button>
        <!--<button @click="alert('Edit user ' + currentId); open = false">
            Mover a otra lista
          </button>-->
        <button @click="alterData(currentId); open = false">
          Eliminar de mi lista de deseos
        </button>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer_top">

      <div class="footer_left">
        <img src="img/logo.png" alt="" />
        <div class="footer_links">
          <div class="links_account">
            <h4>Mi cuenta</h4>
            <ul>
              <li><a href="#">Iniciar Sesión</a></li>
              <li><a href="#">Registrarme</a></li>
            </ul>
          </div>
          <div class="links_help">
            <h4>Soporte</h4>
            <ul>
              <li><a href="#">Contacto</a></li>
              <li><a href="preguntas.html">Preguntas frecuentes</a></li>
              <li><a href="#">Nuestras tiendas</a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="footer_right">
        <div class="footer_social">
          <h4>Síguenos</h4>
          <div class="social_icons">
            <a href="#" class="icon_nav"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="icon_nav"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" class="icon_nav"><i class="fa-brands fa-facebook"></i></a>
          </div>
        </div>
        <div class="footer_libro">
          <img src="img/libro-reclamaciones2.png" alt="" />
        </div>
      </div>

    </div>
    <div class="footer_bottom">
      <img src="img/pay/medios-pago.webp" alt="" />
      <p>&copy; 2025 WomSport | Todos los derechos reservados</p>
    </div>
  </footer>
  <script src="js/favoritos.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/header.js"></script>
</body>

</html>
