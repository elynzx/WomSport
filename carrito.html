<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
    <!-- CSS -->

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/paginas/carrito.css" />
    <link rel="stylesheet" href="css/componentes/product.css" />
    <link rel="stylesheet" href="css/componentes/spinner.css" />
    <link rel="stylesheet" href="css/componentes/header.css" />
    <link rel="stylesheet" href="css/componentes/footer.css" />
    <link rel="stylesheet" href="css/componentes/buttons.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,400;0,700;0,800;1,100;1,400;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <title>WomSport</title>
  </head>

  <body>
    <header>
      <center>
        <p class="delivery">Delivery gratis a partir de S/200</p>
      </center>
      <div class="header_content">
        <nav class="header_nav">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="tienda.html">Tienda</a></li>
            <li><a href="ofertas.html">Ofertas</a></li>
            <li><a href="nosotros.html">Nosotros</a></li>
            <li><a href="contacto.html">Contacto</a></li>
          </ul>
        </nav>

        <div class="header_logo">
          <a href="index.html"
            ><img src="img/logo.png" alt="Logo de WomSport"
          /></a>
        </div>

        <div class="header_right">
          <div class="search_bar">
            <input type="text" id="search-input" placeholder="Buscar" />
            <span id="search-btn">
              <i class="fa-solid fa-magnifying-glass"></i>
            </span>
          </div>
          <div class="header_icons">
            <a href="favoritos.html" class="icon_nav">
              <i class="fa-regular fa-heart"></i>
            </a>
            <a href="carrito.html" class="icon_nav">
              <i class="fas fa-shopping-cart"></i>
            </a>
            <a href="sesion.html" class="icon_nav">
              <i class="fa-regular fa-user"></i>
            </a>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div id="loading" class="spinnercontainer" style="height: 80dvh">
        <div class="spinner"></div>
      </div>
      <div
        id="items"
        class="container"
        style="display: none; padding: 2rem 2rem 0"
      >
        <div x-data="productCard()">
          <!-- Mostrar productos -->
          <template x-if="products.length > 0">
            <div>
              <template
                x-for="(product, productIndex) in products"
                :key="product.id"
              >
                <div class="crt-card">
                  <!-- Header del producto -->
                  <div class="crt-card-header">
                    <img
                      :src="product.image"
                      :alt="product.name"
                      class="crt-product-image"
                    />
                    <div class="crt-product-info">
                      <div class="crt-product-name" x-text="product.name"></div>
                      <div class="crt-product-total">
                        <span style="color: #999">S./</span>
                        <span x-text="product.cost"></span> ×
                        <span x-text="totalQuantity(product)"></span> =
                        <span class="crt-total-cost">
                          S./<span x-text="totalCost(product)"></span>
                        </span>
                      </div>
                    </div>
                  </div>

                  <!-- Cuerpo del producto (tallas y botones) -->
                  <div class="crt-card-body">
                    <template x-if="product.sizes.length > 0">
                      <div>
                        <template
                          x-for="(size, sizeIndex) in product.sizes"
                          :key="sizeIndex"
                        >
                          <div class="crt-size-item">
                            <span
                              class="crt-size-name"
                              x-text="size.name"
                            ></span>
                            <div class="crt-quantity-controls">
                              <button
                                class="crt-quantity-btn"
                                @click="updateQuantity(productIndex, sizeIndex, -1)"
                                :disabled="size.quantity <= 0"
                              >
                                −
                              </button>
                              <span
                                class="crt-quantity-display"
                                x-text="size.quantity"
                              ></span>
                              <button
                                class="crt-quantity-btn"
                                @click="updateQuantity(productIndex, sizeIndex, 1)"
                              >
                                +
                              </button>
                              <button
                                class="crt-remove-size"
                                @click="removeSize(productIndex, sizeIndex)"
                                title="Quitar talla"
                              >
                                ✕
                              </button>
                            </div>
                          </div>
                        </template>
                      </div>
                    </template>

                    <template x-if="product.sizes.length === 0">
                      <div class="crt-empty-state">No sizes available</div>
                    </template>

                    <button
                      class="crt-delete-product"
                      @click="deleteProduct(productIndex)"
                    >
                      Eliminar producto
                    </button>
                  </div>
                </div>
              </template>

              <!-- Total general -->
              <div class="crt-card">
                <div class="crt-card-header">
                  Total: S./&nbsp;<span x-text="grandTotal()"></span>
                </div>
                <button class="crt-delete-product" style="margin: 0.5rem; width: calc(100% - 1rem);" onclick="window.location.href='checkout.html'">
                  Pagar
                </button>
              </div>
            </div>
          </template>

          <!-- Estado vacío: sin productos -->
          <template x-if="products.length === 0">
            <div id="non-items" class="container" style="padding: 0 0 2rem">
              <img id="bag" src="img/shoping-bag.png" alt="Bolsa de compra" />
              <span
                style="
                  margin: 1rem 0rem 2rem;
                  color: #ccc;
                  font-weight: 800;
                  font-size: large;
                "
              >
                No hay productos en el carrito
              </span>
              <button class="primary-button">
                <a href="/tienda.html" style="color: #fff !important">
                  VOLVER A LA TIENDA
                </a>
              </button>
            </div>
          </template>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer_top">
        <div class="footer_left">
          <img src="img/logo.png" alt="" />
          <div class="footer_links">
            <div class="links_account">
              <h4>Mi cuenta</h4>
              <ul>
                <li><a href="perfil.html">Iniciar Sesión</a></li>
                <li><a href="sesion.html">Registrarme</a></li>
              </ul>
            </div>
            <div class="links_help">
              <h4>Soporte</h4>
              <ul>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="preguntas.html">Preguntas frecuentes</a></li>
                <li><a href="contacto.html#ubicacion">Nuestras tiendas</a></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="footer_right">
          <div class="footer_social">
            <h4>Síguenos</h4>
            <div class="social_icons">
              <a href="#" class="icon_nav"
                ><i class="fa-brands fa-instagram"></i
              ></a>
              <a href="#" class="icon_nav"
                ><i class="fa-brands fa-tiktok"></i
              ></a>
              <a href="#" class="icon_nav"
                ><i class="fa-brands fa-facebook"></i
              ></a>
            </div>
          </div>
          <div class="footer_libro">
            <img src="img/libro-reclamaciones2.png" alt="" />
          </div>
        </div>
      </div>
      <div class="footer_bottom">
        <img src="img/pay/medios-pago.webp" alt="" />
        <p>&copy; 2025 WomSport | Todos los derechos reservados</p>
      </div>
    </footer>
    <script src="js/carritoClass.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/header.js"></script>
  </body>
</html>
