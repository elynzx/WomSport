<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./img/logo.svg" type="image/svg+xml" />
    <!-- CSS -->

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/paginas/inicio.css" />
    <link rel="stylesheet" href="css/componentes/product.css" />
    <link rel="stylesheet" href="css/paginas/checkout.css" />
    <link rel="stylesheet" href="css/componentes/footer.css" />
    <link rel="stylesheet" href="css/paginas/favoritos.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <title>WomSport</title>
  </head>

  <body>
    <header>
      <center>
        <p class="delivery">Delivery gratis a partir de S/200.00</p>
      </center>
      <div class="header_content">
        <div class="header_logo">
          <a href="index.html"
            ><img src="img/logo.png" alt="Logo de WomSport"
          /></a>
        </div>
      </div>
    </header>

    <section class="check_p">
      <a href="">Carro de Compra</a>
      <p>></p>
      <a href="">Check out</a>
    </section>

    <main>
      <div class="check_left">
        <div class="contact_check1">
          <h2>CONTACTO</h2>
          <form>
            <input
              type="email"
              required
              name="useremail"
              placeholder="Correo electrónico *"
            />
          </form>
          <img src="img/Line 12.png" alt="" />
        </div>
        <h2>DIRECCIÓN</h2>
        <img src="img/Line 12.png" alt="" />

        <h2>OPCIONES DE ENTREGA</h2>
        <img src="img/Line 12.png" alt="" />

        <div class="pago_check1"></div>
        <h2>PAGO</h2>
        <div class="metodos_pagocheck1">
          <img src="img/pay/American Express.png" alt="American Express" /><img
            src="img/pay/pagoefectivo 1.png"
            alt="Pagoefectivo"
          /><img src="img/pay/mastercard.png" alt="Mastercard" /><img
            src="img/pay/diners.png"
            alt="Diners Club"
          /><img src="img/pay/visa.png" alt="VISA" />
        </div>
      </div>
      <div class="check_right"></div>
    </main>

    <footer>
      <div class="footer_left">
        <img src="img/logo.png" alt="" />
        <div class="footer_links">
          <div class="links_account">
            <h4>Mi cuenta</h4>
            <ul>
              <li><a href="#">Iniciar Sesión</a></li>
              <li><a href="#">Registrarme</a></li>
            </ul>
          </div>
          <div class="links_help">
            <h4>Soporte</h4>
            <ul>
              <li><a href="#">Contacto</a></li>
              <li><a href="#">Preguntas frecuentes</a></li>
              <li><a href="#">Nuestras tiendas</a></li>
            </ul>
          </div>
        </div>
      </div>

      <div class="footer_right">
        <div class="footer_social">
          <h4>Síguenos</h4>
          <div class="social_icons">
            <a href="#" class="icon_nav"
              ><i class="fa-brands fa-instagram"></i
            ></a>
            <a href="#" class="icon_nav"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" class="icon_nav"
              ><i class="fa-brands fa-facebook"></i
            ></a>
          </div>
        </div>
        <div class="footer_libro">
          <img src="img/libro-reclamaciones.png" alt="" />
        </div>
      </div>
    </footer>
    <script src="js/favoritos.js"></script>
    <script src="js/inicio.js"></script>
  </body>
</html>
